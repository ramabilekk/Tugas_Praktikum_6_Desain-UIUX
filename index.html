<body>
    
    
    <h1>ini belajar js</h1>

    <script>
        // code js

        const name= "rama";
        let umur = 99;
        let nilai = 100;
        let aktif = true;

        console.log("nama", name);
        console.log("umur", umur);
        console.log("nilai", nilai);
        console.log("aktif", aktif);
        console.log("tipe nilai", typeof nilai);

        const tugas = 80;
        const uts = 70;
        const uas = 90;
        const akhir = tugas * 0.30 + uts * 0.30 + uas * 0.40;

        console.log("nilai akhir", akhir);
        console.log("lulus:", akhir >= 60);

        // percabangan if else
        const nilai2 = 78;
        let kategori;

        if (nilai2 >= 85) {
            kategori = "A";
        } else if (nilai2 >= 70) {
            kategori = "B";
        } else if (nilai2 >= 60) {
            kategori = "C";
        } else {
            kategori = "D";
        }

        console.log("nilai2", nilai2);
        console.log("kategori", kategori);    

        //perulangan dan fungsi dasar
        function hitungDiskon(harga, persen) {
            return harga - (harga * persen / 100);
        }
        
        for (let i =1; i <= 3; i++) {
            const harga = i * 10000;
            const bayar = hitungDiskon(harga, 10);
            console.log("barang", i , "harga", harga, "bayar:", bayar);
        }

        // Praktikum Mandiri Pengolah Nilai Mahasiswa
        const namaMahasiswa = "Rama";
        const nilaiTugas = 90;
        const nilaiUts = 80;
        const nilaiUas = 90;

        const nilaiAkhir = nilaiTugas * 0.30 + nilaiUts * 0.30 + nilaiUas * 0.40;
        let statusKelulusan;

        if (nilaiAkhir >= 60) {
            statusKelulusan = "LULUS";
        } else {
            statusKelulusan = "TIDAK LULUS";
        }

        console.log("=== Pengolah Nilai Mahasiswa ===");
        console.log("Nama Mahasiswa:", namaMahasiswa);
        console.log("Nilai Akhir:", nilaiAkhir);
        console.log("Status Kelulusan:", statusKelulusan);
        
    </script>
</body>
